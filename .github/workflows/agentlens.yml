name: AgentLens CI
on:
  pull_request:
    branches: [main, master]
jobs:
  agentlens:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npx agentlens ci --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
